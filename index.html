    * {

    nav a:hover {

    /* ==================================================

        sans-serif;

        0 0 20px #0ff;

      margin-bottom: 10px;
    }


    #message p {

      font-size:

    }


    /* ==================================================
       LOGO BUTTON AREA
       ================================================== */

    }

          rgba(255, 94, 196, 0.55)

    /* ==================================================

  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script>


    /* ==================================================
       ELEMENTS
       ================================================== */

    const logo =
      document.getElementById("logo");

    const canvas =
      document.getElementById("space");

    const ctx =
      canvas.getContext("2d");


    /* ==================================================
       CANVAS RESIZE
       ================================================== */

    let w;
    let h;


    function resize() {

      w =
        canvas.width =
        window.innerWidth;

      h =
        canvas.height =
        window.innerHeight;

    }


    resize();


    window.addEventListener(
      "resize",
      resize
    );


    /* ==================================================
       STAR IMAGE
       ================================================== */

    const img =
      new Image();

    img.src =
      "/assets/images/Star.png";


    /* ==================================================
       CREATE STARS
       ================================================== */

    let stars = [];


    for (
      let i = 0;
      i < 200;
      i++
    ) {

      stars.push({

        x:
          (Math.random() - 0.5)
          * w * 2,

        y:
          (Math.random() - 0.5)
          * h * 2,

        z:
          Math.random() * w

      });

    }


    /* ==================================================
       STARFIELD ANIMATION
       ================================================== */

    function animate() {

      ctx.clearRect(
        0,
        0,
        w,
        h
      );


      stars.forEach(
        (s, i) => {

          s.z -= 0.25;


          if (s.z <= 0) {

            stars[i] = {

              x:
                (Math.random() - 0.5)
                * w * 2,

              y:
                (Math.random() - 0.5)
                * h * 2,

              z:
                w

            };

          }


          const k =
            128 / s.z;


          const x =
            s.x * k +
            w / 2;


          const y =
            s.y * k +
            h / 2;


          const size =
            (1 - s.z / w)
            * 20;


          ctx.globalAlpha =
            0.25;


          if (img.complete) {

            ctx.drawImage(
              img,
              x,
              y,
              size,
              size
            );

          }

        }
      );


      requestAnimationFrame(
        animate
      );

    }


    animate();


    /* ==================================================
       LOGO PULSE
       ================================================== */

    function startPulse() {

      setInterval(
        () => {

          logo.style.animation =
            "logoPulse 1.2s ease";


          setTimeout(
            () => {

              logo.style.animation =
                "";

            },
            1200
          );

        },
        8000
      );

    }


    /* ==================================================
       SPARKLES
       ================================================== */

    function startSparkles() {

      setInterval(
        () => {

          const rect =
            logo.getBoundingClientRect();


          const sparkle =
            document.createElement("img");


          sparkle.src =
            img.src;


          sparkle.className =
            "sparkle";


          const angle =
            Math.random()
            * Math.PI
            * 2;


          const distance =
            20 +
            Math.random() * 40;


          const randomX =
            rect.left +
            Math.random()
            * rect.width;


          const randomY =
            rect.top +
            Math.random()
            * rect.height;


          sparkle.style.left =
            randomX + "px";


          sparkle.style.top =
            randomY + "px";


          document.body.appendChild(
            sparkle
          );


          setTimeout(
            () => {

              sparkle.style.transform =
                `translate(
                  ${Math.cos(angle) * distance}px,
                  ${Math.sin(angle) * distance}px
                )
                scale(0.5)`;


              sparkle.style.opacity =
                "0";

            },
            10
          );


          setTimeout(
            () => {

              sparkle.remove();

            },
            600
          );


        },
        2000
      );

    }


    /* ==================================================
       START EFFECTS
       ================================================== */

    startPulse();

    startSparkles();


  </script>
