    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      background: black;
      font-family: 'Poppins', sans-serif;
      color: white;
      overflow: hidden;
    }


    /* =========================
       NAV
       ========================= */

    nav {
      position: fixed;
      top: 20px;
      right: 30px;
      z-index: 9999;

      display: flex;
      gap: 20px;

      font-size: 0.9rem;

      opacity: 1;
    }

    nav a {
      color: #0ff;
      text-decoration: none;
      opacity: 0.6;

      transition: 0.3s;
    }

    nav a:hover {
      opacity: 1;

      text-shadow:
        0 0 8px #0ff;
    }


    /* =========================
       STARFIELD
       ========================= */

    canvas {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      opacity: 1;

      z-index: 0;
    }


    /* =========================
       LOGO
       ========================= */

    #logo-wrapper {
      position: fixed;

      top: 60px;
      left: 50%;

      transform: translateX(-50%);

      text-align: center;

      z-index: 10;

      opacity: 1;
    }

    #logo {
      width: 220px;
    }


    /* =========================
       MESSAGE
       ========================= */

    #message {
      position: fixed;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 90%;

      max-width: 800px;

      text-align: center;

      opacity: 1;

      pointer-events: auto;

      z-index: 10;
    }

    #message h1 {
      font-family: 'Orbitron', sans-serif;

      text-shadow:
        0 0 20px #0ff;

      margin-bottom: 10px;
    }

    #message p {
      color: #ccc;

      margin-bottom: 20px;
    }


    /* =========================
       CTA BUTTONS
       ========================= */

    .cta {
      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      gap: 10px;
    }

    .cta a {
      display: inline-block;

      padding: 12px 18px;

      border: 1px solid rgba(0, 255, 255, 0.6);

      color: white;

      text-decoration: none;

      border-radius: 8px;

      text-shadow:
        0 0 6px rgba(255, 255, 255, 0.6);

      background:
        rgba(0, 255, 255, 0.18);

      backdrop-filter: blur(6px);

      -webkit-backdrop-filter: blur(6px);

      box-shadow:
        0 0 8px rgba(0, 255, 255, 0.4),
        inset 0 0 6px rgba(0, 255, 255, 0.2);

      transition:
        all 0.25s ease;
    }

    .cta a:hover {
      transform: scale(1.08);

      background:
        rgba(0, 255, 255, 0.41);

      box-shadow:
        0 0 14px rgba(0, 255, 255, 0.8),
        inset 0 0 10px rgba(0, 255, 255, 0.4);
    }


    /* =========================
       SUPER PUNKASS BUTTON
       ========================= */

    .cta a.super-punkass {
      border-color: rgba(255, 94, 196, 0.85);

      background:
        rgba(255, 94, 196, 0.18);

      box-shadow:
        0 0 10px rgba(255, 94, 196, 0.5),
        inset 0 0 8px rgba(255, 94, 196, 0.2);

      text-shadow:
        0 0 8px rgba(255, 94, 196, 0.9);
    }

    .cta a.super-punkass:hover {
      background:
        rgba(255, 94, 196, 0.4);

      box-shadow:
        0 0 18px rgba(255, 94, 196, 0.9),
        inset 0 0 12px rgba(255, 94, 196, 0.35);

      transform: scale(1.1);
    }


    /* =========================
       FOOTER
       ========================= */

    footer {
      position: fixed;

      bottom: 10px;

      width: 100%;

      text-align: center;

      font-size: 0.75rem;

      color: #666;

      opacity: 1;

      z-index: 10;
    }


    /* =========================
       LOGO PULSE
       ========================= */

    @keyframes logoPulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

    }


    /* =========================
       SPARKLES
       ========================= */

      position: fixed;

      width: 8px;

      pointer-events: none;

      z-index: 9999;

      transition: 0.6s;

    /* =========================

  <script>

    /* ==================================================
       STERLWORLD — IMMEDIATE START

       No:
       - Tap to Enter
       - Loading screen
       - Loading bar
       - Artificial delay
       - Click-to-start
       ================================================== */


    /* =========================
       ELEMENTS
       ========================= */

    const logo =
      document.getElementById("logo");

    const canvas =
      document.getElementById("space");

    const ctx =
      canvas.getContext("2d");


    /* =========================
       STARFIELD SETUP
       ========================= */

    let w;
    let h;

    function resize() {

      w = canvas.width =
        window.innerWidth;

      h = canvas.height =
        window.innerHeight;

    }

    resize();

    window.addEventListener(
      "resize",
      resize
    );


    /* =========================
       STAR IMAGE
       ========================= */

    const img =
      new Image();

    img.src =
      "/assets/images/Star.png";


    /* =========================
       CREATE STARS
       ========================= */

    let stars = [];

    for (
      let i = 0;
      i < 200;
      i++
    ) {

      stars.push({

        x:
          (Math.random() - 0.5)
          * w * 2,

        y:
          (Math.random() - 0.5)
          * h * 2,

        z:
          Math.random() * w

      });

    }


    /* =========================
       STARFIELD ANIMATION
       ========================= */

    function animate() {

      ctx.clearRect(
        0,
        0,
        w,
        h
      );


      stars.forEach(
        (s, i) => {

          s.z -= 0.25;


          if (s.z <= 0) {

            stars[i] = {

              x:
                (Math.random() - 0.5)
                * w * 2,

              y:
                (Math.random() - 0.5)
                * h * 2,

              z: w

            };

          }


          const k =
            128 / s.z;


          const x =
            s.x * k + w / 2;


          const y =
            s.y * k + h / 2;


          const size =
            (1 - s.z / w) * 20;


          ctx.globalAlpha =
            0.25;


          if (img.complete) {

            ctx.drawImage(
              img,
              x,
              y,
              size,
              size
            );

          }

        }
      );


      requestAnimationFrame(
        animate
      );

    }


    animate();


    /* =========================
       LOGO PULSE
       ========================= */

    function startPulse() {

      setInterval(
        () => {

          logo.style.animation =
            "logoPulse 1.2s ease";


          setTimeout(
            () => {

              logo.style.animation =
                "";

            },
            1200
          );

        },
        8000
      );

    }


    /* =========================
       SPARKLES
       ========================= */

    function startSparkles() {

      setInterval(
        () => {

          const rect =
            logo.getBoundingClientRect();


          const sparkle =
            document.createElement("img");


          sparkle.src =
            img.src;


          sparkle.className =
            "sparkle";


          const angle =
            Math.random()
            * Math.PI
            * 2;


          const distance =
            20 +
            Math.random() * 40;


          const randomX =
            rect.left +
            Math.random()
            * rect.width;


          const randomY =
            rect.top +
            Math.random()
            * rect.height;


          sparkle.style.left =
            randomX + "px";


          sparkle.style.top =
            randomY + "px";


          document.body.appendChild(
            sparkle
          );


          setTimeout(
            () => {

              sparkle.style.transform =
                `translate(
                  ${Math.cos(angle) * distance}px,
                  ${Math.sin(angle) * distance}px
                )
                scale(0.5)`;


              sparkle.style.opacity =
                "0";

            },
            10
          );


          setTimeout(
            () => {

              sparkle.remove();

            },
            600
          );


        },
        2000
      );

    }


    /* =========================
       START EVERYTHING
       ========================= */

    startPulse();

    startSparkles();

  </script>
