<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Super Punkass | SterlWorld</title>

    <style>
        /* =========================================
           SUPER PUNKASS
           ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            /*
             * SUPER PUNKASS CINEMATIC SKY
             *
             * Deep burgundy-black at the top
             * Slowly transitions into a warm
             * dusty orange toward the bottom.
             */

            background: linear-gradient(
                to bottom,
                #16070D 0%,
                #16070D 38%,
                #210B12 52%,
                #35151B 65%,
                #5B302B 82%,
                #A76555 100%
            );

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            text-align: center;

            overflow-x: hidden;
        }


        /* =========================================
           SUPER PUNKASS LOGO
           ========================================= */

        .logo {
            display: block;

            width: 500px;
            max-width: 85%;

            height: auto;

            margin: 40px auto 0 auto;
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {

            .logo {
                width: 420px;
                max-width: 90%;

                margin-top: 30px;
            }

        }
    </style>
</head>


<body>

    <!-- SUPER PUNKASS LOGO -->

    <img
        src="../assets/images/Super%20Punkass%20Logo%20Final.png"
        alt="Super Punkass"
        class="logo"
    >

</body>
</html>
